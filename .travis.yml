dist: xenial

before_install:
  - mkdir build install
  - wget https://www.dropbox.com/s/acg6w7okwn9i6s5/bert_frozen_seq32.pb -P build
  - wget https://www.dropbox.com/s/1t9ti7sam6mmz5w/vocab.txt -P build

script:
  - cd build
  - cmake .. -DcuBERT_ENABLE_MKL_SUPPORT=ON -DCMAKE_INSTALL_PREFIX=../install
  - make install
  - OMP_NUM_THREADS=4 make test
  - cd .. && python setup.py sdist && sudo pip install dist/cuBERT-0.1.tar.gz -vvv
  - cp build/bert_frozen_seq32.pb python/cuBERT/tests/
  - cp build/vocab.txt python/cuBERT/tests/
  - python python/cuBERT/tests/test_compute.py
  - python python/cuBERT/tests/test_tokenize_compute.py
